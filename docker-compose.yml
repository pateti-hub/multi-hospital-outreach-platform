services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outreach
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-outreach-password}
    ports:
      - "5432:5432"
    volumes:
      - outreach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://outreach:${POSTGRES_PASSWORD:-local-outreach-password}@db:5432/outreach
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-before-deploying}
      ENVIRONMENT: development
      DEMO_AUTH_ENABLED: "true"
      PERSISTENCE_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  outreach_pgdata: